name: Travel OS Autonomous Serverless Runner

on:
  schedule:
    # Run every 4 hours automatically
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main
      - master

jobs:
  run-travel-os:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Travel OS Runner Cycle (Routines 1 - 5)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python serverless_runner.py

      - name: Commit & Push Updated Live Blueprints (Dual Sync Parity)
        run: |
          git config --global user.name "Travel-OS-Autonomous-Runner"
          git config --global user.email "travel-os@antigravity.internal"
          git add core/ google_docs/ web/ last_runner_execution.json change_requests.json .agents/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(sync): automated dual blueprint, change requests & booking update [skip ci]" && git push)
