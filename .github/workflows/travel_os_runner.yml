name: Travel OS Autonomous Serverless Runner

on:
  schedule:
    # Runs automatically every 4 hours in the GitHub cloud
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows 1-tap manual trigger from your phone via GitHub app/web
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-travel-os:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Travel OS Runner Cycle (Routines 1 - 5)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python serverless_runner.py

      - name: Commit & Push to Main Branch
        run: |
          git config --global user.name "Travel-OS-Autonomous-Runner"
          git config --global user.email "travel-os@antigravity.internal"
          git add core/ google_docs/ web/ documents/ last_runner_execution.json change_requests.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(sync): automated dual blueprint, change requests & booking update [skip ci]" && git push origin main)

      - name: Deploy Live Web Dashboard to GitHub Pages
        run: |
          cd web
          git init
          git config user.name "Travel-OS-Autonomous-Runner"
          git config user.email "travel-os@antigravity.internal"
          git checkout -B gh-pages
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(pages): deploy updated travel os dashboard [skip ci]" && git remote add origin https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git && git push -u origin gh-pages --force)
